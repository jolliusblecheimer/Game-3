<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1a17">
<title>Tenka — Rise of the Clan</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Tenka">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui"></div>
<div id="loading"><div class="seal">天下</div><h1>Tenka</h1><p>Preparing the valley…</p></div>
<script type="module">
// Returning players always get the newest version: when the game has been updated
// since this browser last saw it, every file is re-downloaded once before starting.
(async () => {
  try {
    const r = await fetch('version.json', { cache: 'no-store' });
    if (r.ok) {
      const { v, files } = await r.json();
      let have = null, played = false;
      try { have = localStorage.getItem('tenka.ver'); played = !!localStorage.getItem('tenka.save.v1'); } catch (_) { /* no storage */ }
      if (have !== v) {
        const again = sessionStorage.getItem('tenka.updating') === v;
        if (played && !again) {
          const note = document.querySelector('#loading p'); if (note) note.textContent = 'Updating to the newest version…';
          await Promise.all(files.map(f => fetch(f, { cache: 'reload' }).catch(() => null)));
          try { localStorage.setItem('tenka.ver', v); sessionStorage.setItem('tenka.updating', v); } catch (_) { /* */ }
          location.reload(); return;
        }
        try { localStorage.setItem('tenka.ver', v); } catch (_) { /* */ }
      }
    }
  } catch (_) { /* offline: just start */ }
  import('./js/main.js');
})();
// offline play (and "Add to Home Screen"): a service worker keeps a copy of every file
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => null);
</script>
</body>
</html>
